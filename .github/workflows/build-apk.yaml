name: Build APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string
      versionCode:
        description: 'Version code (integer)'
        required: false
        default: '1'
        type: number
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.1
          ndk-version: ''

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, OU=Dev, O=CloudPhone, L=Unknown, ST=Unknown, C=CN"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "versionName=${{ inputs.versionName }}" >> $GITHUB_OUTPUT
            echo "versionCode=${{ inputs.versionCode }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag: v1.0.0 -> 1.0.0
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
            echo "versionName=$VER" >> $GITHUB_OUTPUT
            echo "versionCode=${VER//./}" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.versionName }} \
            -PversionCode=${{ steps.version.outputs.versionCode }} \
            --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudphone-agent-service-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload to Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          generate_release_notes: true